<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18001f">
  <title>Log Masuk Urusetia • SUKNA-21</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-brand">
      <span class="mini-kicker">SUKNA-21 SELANGOR 2026</span>
      <div class="script-title small">Majlis Apresiasi</div>
      <div class="gold-divider"><span>✦</span></div>
      <p>Portal Urusetia</p>
    </div>

    <section class="login-card">
      <h1>Log Masuk Urusetia</h1>
      <p>Masukkan akaun urusetia untuk membuka dashboard kehadiran.</p>

      <form id="loginForm">
        <label class="field">
          <span>Username</span>
          <input id="username" type="text" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="gold-button" type="submit">Log Masuk</button>
      </form>

      <div id="loginError" class="notice warning hidden">Username atau password tidak sah.</div>
      <a class="back-link" href="index.html">← Kembali ke portal RSVP</a>
    </section>
  </div>

  <script src="urusetia.js"></script>
</body>
</html>
