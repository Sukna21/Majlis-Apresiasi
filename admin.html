<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18001f">
  <title>Dashboard Urusetia • Majlis Apresiasi SUKNA-21</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=51">
  <script>
    if (sessionStorage.getItem("sukna21_admin_login") !== "1") {
      location.replace("urusetia.html");
    }
  </script>
</head>
<body class="admin-page">
  <header class="admin-header">
    <div>
      <span class="mini-kicker">URUSETIA • SUKNA-21 SELANGOR 2026</span>
      <h1>Dashboard Kehadiran</h1>
      <p>Majlis Apresiasi • Isnin, 28 September 2026</p>
    </div>
    <div class="admin-actions">
      <button class="ghost-dark" id="refreshBtn">↻ Refresh</button>
      <button class="gold-small" id="exportBtn">Export CSV</button>
      <button class="danger-small" id="logoutBtn">Log Keluar</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="stats-grid four">
      <article class="stat-card">
        <span>Jumlah Jemputan</span>
        <strong id="statTotal">0</strong>
      </article>
      <article class="stat-card hadir-card">
        <span>Hadir</span>
        <strong id="statHadir">0</strong>
      </article>
      <article class="stat-card tidak-card">
        <span>Tidak Hadir</span>
        <strong id="statTidak">0</strong>
      </article>
      <article class="stat-card pending-card">
        <span>Belum Menjawab</span>
        <strong id="statPending">0</strong>
      </article>
    </section>

    <section class="dashboard-card">
      <div class="dashboard-tools">
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-filter="all">Semua</button>
          <button class="filter-tab" data-filter="hadir">Hadir</button>
          <button class="filter-tab" data-filter="tidak_hadir">Tidak Hadir</button>
          <button class="filter-tab" data-filter="belum_jawab">Belum Menjawab</button>
        </div>
        <input class="search-box" id="searchBox" placeholder="Cari nama / bahagian...">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Bahagian</th>
              <th>Status</th>
              <th>Dikemas Kini</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="4" class="empty-row">Memuatkan data...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="table-footer">
        <span id="rowCount">0 rekod</span>
        <span>Dashboard Urusetia Majlis Apresiasi SUKNA-21</span>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=52"></script>
  <script src="admin.js?v=52"></script>
</body>
</html>
